name: Security Pipeline
on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Barreira 1 - Secret scanning: varre o histórico do Git atrás de chaves e senhas
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Anota segredos encontrados
        if: failure()
        run: |
          jq -r '.runs[0].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine),title=Gitleaks - \(.ruleId)::\(.message.text) (commit \(.partialFingerprints.commitSha[0:7]))"' results.sarif

  # Barreira 2 - SAST: procura padrões vulneráveis no código-fonte (ex.: eval)
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: semgrep ci --config auto --json-output=semgrep.json
        env:
          SEMGREP_RULES: p/default
      - name: Anota código vulnerável encontrado
        if: failure()
        run: |
          jq -r '.results[] | "::error file=\(.path),line=\(.start.line),title=Semgrep - \(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " "))"' semgrep.json

  # Barreira 3 - Scan de imagem: builda a imagem e barra CVE CRITICAL com correção disponível
  trivy:
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build da imagem
        run: docker build -t cp5-site:${{ github.sha }} .
      - name: Trivy scan
        # v0.35.0 fixada por SHA: única versão não afetada pelo ataque de supply chain de mar/2026 (CVE-2026-33634)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: cp5-site:${{ github.sha }}
          format: json
          output: trivy.json
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Relatório do Trivy
        if: always()
        run: |
          jq -r '.Results[] | "Alvo: \(.Target) | CVEs CRITICAL corrigíveis: \(.Vulnerabilities // [] | length)"' trivy.json
          jq -r '.Results[].Vulnerabilities // [] | .[] | "::error title=Trivy - \(.VulnerabilityID) (\(.Severity))::\(.PkgName) \(.InstalledVersion) vulnerável - corrigido em \(.FixedVersion). \(.Title)"' trivy.json
